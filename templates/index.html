<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lakebase Ticketing System</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 28%),
        radial-gradient(circle at right, rgba(34, 197, 94, 0.18), transparent 24%),
        linear-gradient(180deg, #020617 0%, #0f172a 100%);
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }
    .hero {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.8rem);
      letter-spacing: -0.03em;
    }
    .subtle { color: var(--muted); max-width: 760px; line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.35);
      overflow: hidden;
    }
    .card h2 {
      margin: 0;
      padding: 18px 20px 0;
      font-size: 1.1rem;
    }
    .card-body { padding: 20px; }
    label { display: block; margin: 14px 0 6px; font-size: 0.92rem; color: #cbd5e1; }
    input, select, textarea, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      cursor: pointer;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border: 0;
      font-weight: 700;
    }
    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 8px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent-2);
    }
    .tickets, .messages {
      display: grid;
      gap: 12px;
    }
    .ticket {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.78);
      padding: 16px;
      cursor: pointer;
    }
    .ticket.active { outline: 2px solid rgba(56, 189, 248, 0.5); }
    .ticket-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    .ticket-title { font-weight: 700; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
    }
    .ticket-body {
      color: var(--muted);
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .message {
      border-left: 3px solid rgba(56, 189, 248, 0.6);
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
    }
    .message small { color: var(--muted); display: block; margin-bottom: 6px; }
    .empty {
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 16px;
    }
    .split { display: grid; gap: 14px; }
    .error { color: #fecaca; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <h1>Support tickets, backed by Lakebase.</h1>
      <div class="subtle">
        Create support tickets, post messages to keep the conversation moving, and store every operational record in Lakebase.
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>New Ticket</h2>
        <div class="card-body">
          <form id="ticket-form">
            <label for="title">Title</label>
            <input id="title" name="title" placeholder="Payment issue for customer ACME" required>

            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="open">Open</option>
              <option value="in_progress">In progress</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>

            <label for="created_by">Created by</label>
            <input id="created_by" name="created_by" placeholder="Optional, defaults to your Databricks identity">

            <button type="submit">Create ticket</button>
          </form>

          <div id="ticket-status" class="status"><span class="status-dot"></span><span>Ready</span></div>
        </div>
      </section>

      <section class="card">
        <h2>Tickets</h2>
        <div class="card-body">
          <div id="tickets" class="tickets"></div>
        </div>
      </section>

      <section class="card">
        <h2>Ticket Detail</h2>
        <div class="card-body split" id="detail">
          <div class="empty">Select a ticket to view its messages.</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const ticketForm = document.getElementById("ticket-form");
    const ticketStatus = document.getElementById("ticket-status");
    const ticketsEl = document.getElementById("tickets");
    const detailEl = document.getElementById("detail");
    let selectedTicketId = null;

    function setStatus(message, isError = false) {
      ticketStatus.innerHTML = "";
      const dot = document.createElement("span");
      dot.className = "status-dot";
      const text = document.createElement("span");
      if (isError) text.className = "error";
      text.textContent = message;
      ticketStatus.appendChild(dot);
      ticketStatus.appendChild(text);
    }

    function formatDate(value) {
      if (!value) return "-";
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
    }

    function renderTickets(items) {
      ticketsEl.innerHTML = "";
      if (!items.length) {
        ticketsEl.innerHTML = '<div class="empty">No tickets yet. Create the first one on the left.</div>';
        return;
      }
      items.forEach((ticket) => {
        const row = document.createElement("div");
        row.className = "ticket" + (ticket.ticket_id === selectedTicketId ? " active" : "");

        const head = document.createElement("div");
        head.className = "ticket-head";

        const title = document.createElement("div");
        title.className = "ticket-title";
        title.textContent = ticket.title;

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = ticket.status;

        head.appendChild(title);
        head.appendChild(badge);

        const body = document.createElement("div");
        body.className = "ticket-body";
        const createdBy = document.createElement("div");
        createdBy.textContent = "Created by: " + (ticket.created_by || "-");
        const createdAt = document.createElement("div");
        createdAt.textContent = "Created: " + formatDate(ticket.created_at);
        const messages = document.createElement("div");
        messages.textContent = "Messages: " + (ticket.message_count ?? 0);
        body.appendChild(createdBy);
        body.appendChild(createdAt);
        body.appendChild(messages);

        row.appendChild(head);
        row.appendChild(body);
        row.addEventListener("click", () => openTicket(ticket.ticket_id));
        ticketsEl.appendChild(row);
      });
    }

    function renderDetail(ticket, messages) {
      detailEl.innerHTML = "";

      if (!ticket) {
        detailEl.innerHTML = '<div class="empty">Select a ticket to view its messages.</div>';
        return;
      }

      const header = document.createElement("div");
      header.className = "split";

      const title = document.createElement("div");
      const titleText = document.createElement("strong");
      titleText.textContent = ticket.title;
      const titleMeta = document.createElement("div");
      titleMeta.className = "meta";
      titleMeta.textContent = "Ticket ID: " + ticket.ticket_id;
      title.appendChild(titleText);
      title.appendChild(titleMeta);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `Status: ${ticket.status} | Created by: ${ticket.created_by} | Created: ${formatDate(ticket.created_at)}`;

      header.appendChild(title);
      header.appendChild(meta);

      const messageForm = document.createElement("form");
      messageForm.innerHTML = `
        <label for="message_text">Add message</label>
        <textarea id="message_text" name="message_text" placeholder="Share the next update, question, or resolution note..." required></textarea>
        <label for="author">Author</label>
        <input id="message_author" name="author" placeholder="Optional, defaults to your Databricks identity">
        <button type="submit">Post message</button>
      `;

      const list = document.createElement("div");
      list.className = "messages";
      if (!messages.length) {
        list.innerHTML = '<div class="empty">No messages yet. Add the first update below.</div>';
      } else {
        messages.forEach((message) => {
          const item = document.createElement("div");
          item.className = "message";
          const metaLine = document.createElement("small");
          metaLine.textContent = `${message.author} · ${formatDate(message.created_at)}`;
          const text = document.createElement("div");
          text.textContent = message.message_text;
          item.appendChild(metaLine);
          item.appendChild(text);
          list.appendChild(item);
        });
      }

      messageForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(messageForm);
        const payload = {
          message_text: formData.get("message_text"),
          author: formData.get("author"),
        };

        const resp = await fetch(`/tickets/${ticket.ticket_id}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!resp.ok) {
          setStatus(data.error || resp.statusText, true);
          return;
        }
        await openTicket(ticket.ticket_id);
        setStatus("Message posted");
      });

      detailEl.appendChild(header);
      detailEl.appendChild(messageForm);
      detailEl.appendChild(list);
    }

    async function loadTickets() {
      const resp = await fetch("/tickets");
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(data.error || resp.statusText, true);
        return [];
      }
      renderTickets(data);
      return data;
    }

    async function openTicket(ticketId) {
      selectedTicketId = ticketId;
      const resp = await fetch(`/tickets/${ticketId}`);
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(data.error || resp.statusText, true);
        return;
      }
      const tickets = await loadTickets();
      renderTickets(tickets);
      renderDetail(data.ticket, data.messages);
    }

    ticketForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(ticketForm);
      const payload = {
        title: formData.get("title"),
        status: formData.get("status"),
        created_by: formData.get("created_by"),
      };

      setStatus("Creating ticket...");
      const resp = await fetch("/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) {
        setStatus(data.error || resp.statusText, true);
        return;
      }

      ticketForm.reset();
      document.getElementById("status").value = "open";
      selectedTicketId = data.ticket_id;
      setStatus("Ticket created");
      await loadTickets();
      await openTicket(data.ticket_id);
    });

    loadTickets().catch((err) => setStatus("Failed to load tickets: " + err, true));
  </script>
</body>
</html>
